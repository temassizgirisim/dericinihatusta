<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Derici Nihat Usta</title>
    <!-- FontAwesome ikonları için -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #121212;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 440px;
            background-color: #1a1a1a;
            border: 2px solid #d4af37;
            border-radius: 24px;
            padding: 30px 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
            text-align: center;
        }

        /* Logo / Profil Alanı */
        .profile-container {
            position: relative;
            width: 110px;
            height: 110px;
            margin: 0 auto 20px auto;
        }

        .profile-img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 3px solid #d4af37;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #262626;
            color: #d4af37;
            font-size: 40px;
        }

        .status-dot {
            position: absolute;
            bottom: 5px;
            right: 5px;
            width: 16px;
            height: 16px;
            background-color: #27ae60;
            border: 2px solid #1a1a1a;
            border-radius: 50%;
        }

        h1 {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 8px;
            color: #ffffff;
        }

        .subtitle {
            font-size: 13px;
            color: #d4af37;
            letter-spacing: 1px;
            margin-bottom: 25px;
            text-transform: uppercase;
            font-weight: 600;
        }

        /* Butonlar */
        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            padding: 14px;
            margin-bottom: 15px;
            border-radius: 14px;
            font-size: 15px;
            font-weight: 600;
            text-decoration: none;
            cursor: pointer;
            transition: transform 0.2s, opacity 0.2s;
        }

        .btn:active {
            transform: scale(0.98);
        }

        .btn-phone {
            background-color: #262626;
            color: #ffffff;
            border: 1px solid #333;
        }

        .btn-phone i {
            color: #d4af37;
        }

        .btn-whatsapp {
            background-color: #25D366;
            color: #ffffff;
        }

        .btn-instagram {
            background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888);
            color: #ffffff;
        }

        /* Adres Kutusu */
        .address-box {
            background-color: #222222;
            border: 1px solid #333;
            border-radius: 16px;
            padding: 18px;
            margin-top: 10px;
            text-align: left;
        }

        .address-title {
            font-size: 11px;
            color: #888;
            letter-spacing: 1px;
            margin-bottom: 6px;
            font-weight: 700;
        }

        .address-text {
            font-size: 13px;
            color: #ccc;
            line-height: 1.5;
            margin-bottom: 15px;
        }

        .map-link {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #d4af37;
            font-size: 13px;
            text-decoration: none;
            font-weight: 600;
        }

        .map-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Profil Logosu -->
        <div class="profile-container">
            <div class="profile-img">
                <i class="fa-solid fa-vest"></i>
            </div>
            <div class="status-dot"></div>
        </div>

        <h1>Derici Nihat Usta</h1>
        <div class="subtitle">BİRİNCİ KALİTE KUZU DERİSİ & ÖZEL ÜRETİM</div>

        <!-- Telefon Butonu -->
        <a href="tel:05404343452" class="btn btn-phone">
            <i class="fa-solid fa-phone"></i> 0540 434 34 52
        </a>

        <!-- WhatsApp Butonu -->
        <a href="https://wa.me/905404343452?text=Merhaba,%20bilgi%20almak%20istiyorum." target="_blank" class="btn btn-whatsapp">
            <i class="fa-brands fa-whatsapp" style="font-size: 18px;"></i> WhatsApp ile Sipariş / Bilgi
        </a>

        <!-- Instagram Butonu -->
        <a href="https://instagram.com/dericinihatustaa" target="_blank" class="btn btn-instagram">
            <i class="fa-brands fa-instagram" style="font-size: 18px;"></i> Instagram'da Takip Et
        </a>

        <!-- Mağaza Adresi ve Harita -->
        <div class="address-box">
            <div class="address-title">MAĞAZA ADRESİ</div>
            <div class="address-text">
                Eyüpsultan Mahallesi, Kızılay Caddesi, No: 33/C, Samandıra, Sancaktepe / İstanbul
            </div>
            <a href="https://maps.google.com/?q=Eyüpsultan+Mahallesi+Kızılay+Caddesi+No:33+Samandıra+Sancaktepe+İstanbul" target="_blank" class="map-link">
                <i class="fa-solid fa-map-location-dot"></i> Haritada Görüntüle & Yol Tarifi Al
            </a>
        </div>
    </div>

</body>
</html>
