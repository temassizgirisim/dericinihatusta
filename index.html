<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Derici Nihat Usta | Dijital Kartvizit</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap');
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #0b0b0b;
            color: #f3f4f6;
        }
        .gold-card {
            background: linear-gradient(145deg, #161616 0%, #0a0a0a 100%);
            border: 1px solid rgba(212, 175, 55, 0.3);
            box-shadow: 0 10px 30px rgba(0,0,0,0.8), 0 0 15px rgba(212, 175, 55, 0.05);
        }
        .gold-text {
            color: #d4af37;
        }
        .gold-border {
            border-color: rgba(212, 175, 55, 0.3);
        }
        .gold-btn {
            background: #181818;
            border: 1px solid rgba(212, 175, 55, 0.4);
            color: #f3f4f6;
            transition: all 0.3s ease;
        }
        .gold-btn:hover {
            background: #222222;
            border-color: #d4af37;
            color: #d4af37;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <div class="w-full max-w-md gold-card rounded-3xl p-6 text-center relative overflow-hidden">
        
        <!-- Üst Işıltı Çizgisi -->
        <div class="absolute top-0 left-1/2 transform -translate-x-1/2 w-40 h-[2px] bg-gradient-to-r from-transparent via-[#d4af37] to-transparent"></div>

        <!-- Logo / İkon Alanı -->
        <div class="relative w-24 h-24 mx-auto mt-2 mb-3">
            <div class="w-full h-full rounded-full p-1 bg-gradient-to-tr from-[#d4af37] to-[#594817] shadow-lg flex items-center justify-center bg-black">
                <div class="w-full h-full rounded-full bg-[#111] flex items-center justify-center gold-text">
                    <i class="fa-solid fa-vest text-3xl"></i>
                </div>
            </div>
        </div>

        <!-- İşletme ve İsim -->
        <h1 class="text-2xl font-bold text-white tracking-wide">Derici Nihat Usta</h1>
        <p class="text-xs gold-text uppercase tracking-widest mt-1 font-semibold">Birinci Kalite Kuzu Derisi & Özel Üretim</p>

        <!-- Eylem Butonları -->
        <div class="mt-6 space-y-3">
            
            <!-- Rehbere Kaydet Butonu (VCF İndirme) -->
            <button onclick="downloadVCard()" class="gold-btn flex items-center justify-center gap-3 w-full py-3.5 px-4 rounded-2xl shadow-md font-medium text-sm">
                <i class="fa-solid fa-user-plus gold-text text-lg"></i>
                <span>Rehbere Kaydet</span>
            </button>

            <!-- İkili Butonlar (WhatsApp & Ara) -->
            <div class="grid grid-cols-2 gap-3">
                <a href="https://wa.me/905404343452" target="_blank" class="gold-btn flex items-center justify-center gap-2 py-3 px-3 rounded-2xl text-sm font-medium">
                    <i class="fa-brands fa-whatsapp text-emerald-500 text-lg"></i>
                    <span>WhatsApp</span>
                </a>
                <a href="tel:05404343452" class="gold-btn flex items-center justify-center gap-2 py-3 px-3 rounded-2xl text-sm font-medium">
                    <i class="fa-solid fa-phone gold-text text-base"></i>
                    <span>Ara</span>
                </a>
            </div>

            <!-- Instagram Butonu -->
            <a href="https://instagram.com/dericinihatustaa" target="_blank" class="gold-btn flex items-center justify-center gap-2 py-3 px-4 rounded-2xl text-sm font-medium">
                <i class="fa-brands fa-instagram gold-text text-lg"></i>
                <span>@dericinihatustaa</span>
            </a>

        </div>

        <!-- Adres Kartı -->
        <div class="mt-5 p-4 rounded-2xl bg-[#141414] gold-border border text-left">
            <div class="flex items-start gap-3">
                <i class="fa-solid fa-location-dot gold-text text-base mt-0.5"></i>
                <div class="w-full">
                    <div class="text-[10px] text-gray-400 font-semibold uppercase tracking-wider">Mağaza Adresi</div>
                    <p class="text-xs text-gray-200 mt-1 leading-relaxed">
                        Eyüpsultan Mahallesi, Kızılay Caddesi No: 33/C Samandıra Sancaktepe / İstanbul
                    </p>
                    <a href="https://maps.google.com/?q=Eyüpsultan+Mahallesi+Kızılay+Caddesi+No+33+C+Samandıra+Sancaktepe+İstanbul" target="_blank" class="inline-block mt-2 text-[11px] gold-text hover:underline font-semibold">
                        <i class="fa-solid fa-map-location-dot mr-1"></i> Haritada Görüntüle & Yol Tarifi Al
                    </a>
                </div>
            </div>
        </div>

        <!-- Alt Bilgi -->
        <div class="mt-6 pt-3 border-t border-white/5 text-[10px] text-gray-500 flex justify-between items-center">
            <span>© 2026 Derici Nihat Usta</span>
            <span class="gold-text font-medium">Temassız Kartvizit</span>
        </div>

    </div>

    <!-- Rehber VCard Scripti -->
    <script>
        function downloadVCard() {
            const vcard = 
`BEGIN:VCARD
VERSION:3.0
FN:Derici Nihat Usta
TEL:+905404343452
ADR:;;Eyüpsultan Mah. Kızılay Cad. No:33/C Samandıra Sancaktepe;İstanbul;;;Türkiye
URL:https://instagram.com/dericinihatustaa
END:VCARD`;

            const blob = new Blob([vcard], { type: 'text/vcard;charset=utf-8' });
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'Derici_Nihat_Usta.vcf';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            window.URL.revokeObjectURL(url);
        }
    </script>
</body>
</html>
